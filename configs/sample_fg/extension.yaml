# Shared scientific configuration for the E0/E1/E2 estimator extension.
# Campaign membership, estimator mode, K, seed, dataset, and paths are supplied
# by train_sample_fg_extension.py and captured in the resolved run artifact.
DATASET:
  NUM_SHOTS: 16
  SUBSAMPLE_CLASSES: "base"

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

TRAINER:
  COOP:
    PREC: "fp16"
    N_CTX: 4
    CTX_INIT: "a photo of a"
    CSC: False
    CLASS_TOKEN_POSITION: "end"

OPTIM:
  NAME: "sgd"
  LR: 0.002
  WEIGHT_DECAY: 0.0005
  MOMENTUM: 0.9
  SGD_NESTEROV: False
  MAX_EPOCH: 200
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 0.00001

TRAIN:
  CHECKPOINT_FREQ: 0

TEST:
  NO_TEST: False
  FINAL_MODEL: "last_step"
